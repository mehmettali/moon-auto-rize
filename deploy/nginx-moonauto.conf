# /etc/nginx/sites-available/moonauto.conf
server {
    listen 80;
    listen [::]:80;
    server_name moonauto.com.tr www.moonauto.com.tr;

    root /var/www/moonauto;
    index index.html;

    # www'suz → www'lu (canonical)
    if ($host = moonauto.com.tr) { return 301 https://www.moonauto.com.tr$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location ~* \.(webp|jpg|jpeg|png|svg|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404/index.html;
}
