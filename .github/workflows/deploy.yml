name: Deploy (cPanel)

# main'e her push'ta siteyi build edip sunucuya yayınlar.
# Actions sekmesinden "Run workflow" ile elle de tetiklenebilir.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı anda iki deploy çalışmasın; sıraya girsinler.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Build
        run: npm run build

      - name: SSH anahtarını hazırla
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: lftp kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # cPanel hesabında shell kapalı olduğu için rsync/ssh komutu çalışmaz.
      # lftp, SFTP üzerinden uzak shell gerektirmeden dosya aynalar.
      - name: dist/ -> public_html
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          lftp -c "
            set sftp:auto-confirm no;
            set net:max-retries 3;
            set net:timeout 20;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes';
            open -u $DEPLOY_USER,dummy sftp://$DEPLOY_HOST;
            mirror --reverse --parallel=4 --no-perms --verbose=1 dist/ $DEPLOY_PATH;
            bye"

      - name: Yayını doğrula
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://moonauto.com.tr/)
          echo "https://moonauto.com.tr/ -> $code"
          test "$code" = "200"
